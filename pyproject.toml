[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia-humanai-codex-harness"
version = "0.1.0"
description = "Async persistent-memory support for SOFIA Human-AI coding harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "supabase==2.33.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["persistent_memory"]
package-dir = {"" = "src"}
